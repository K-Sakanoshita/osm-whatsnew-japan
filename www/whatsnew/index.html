<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OSM What’s New Japan</title>
  <meta name="description" content="OpenStreetMapで日本国内に追加・編集された地物を、地図とタイムスケールで検索し、更新状況を集計できます。">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#12634f">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="canonical" href="https://armd-01.sakura.ne.jp/whatsnew/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="OSM What’s New Japan">
  <meta property="og:title" content="OSM What’s New Japan">
  <meta property="og:description" content="OpenStreetMapで日本国内に追加・編集された地物を、地図とタイムスケールで検索し、更新状況を集計できます。">
  <meta property="og:url" content="https://armd-01.sakura.ne.jp/whatsnew/">
  <meta property="og:image" content="https://armd-01.sakura.ne.jp/whatsnew/image/whatsnew.png">
  <meta property="og:image:width" content="1672">
  <meta property="og:image:height" content="941">
  <meta property="og:image:alt" content="OSM What’s New Japan 画面イメージ">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OSM What’s New Japan">
  <meta name="twitter:description" content="OpenStreetMapで日本国内に追加・編集された地物を、地図とタイムスケールで検索し、更新状況を集計できます。">
  <meta name="twitter:image" content="https://armd-01.sakura.ne.jp/whatsnew/image/whatsnew.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="map-page">
  <header>
    <img class="site-logo" src="image/site.png" width="480" height="480" alt="">
    <div>
      <h1>OSM What’s New Japan</h1>
      <small>OpenStreetMapで更新された地物の検索・集計</small>
    </div>
    <button id="map-guide-open" class="header-help-button" type="button" aria-haspopup="dialog" aria-label="このサイトの見方" title="このサイトの見方"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.8 9a2.35 2.35 0 0 1 4.55.8c0 1.7-2.35 2-2.35 3.7M12 17h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <nav aria-label="画面切り替え"><a class="header-image-button" href="details.html" aria-label="更新レポート" title="更新レポート"><img src="image/report.png" width="1254" height="1254" alt=""></a></nav>

  </header>
  <main>
    <div class="map-shell">
      <div id="map"></div>
      <div class="map-marker-legend" role="group" aria-label="マーカーの凡例"><span><i class="is-create" aria-hidden="true"></i>新規</span><span><i class="is-modify" aria-hidden="true"></i>更新</span></div>
      <p id="status" class="loading-status" role="status" aria-live="polite">準備中…</p>
      <section id="timeline" class="timeline" hidden aria-label="更新時刻を選択">
        <div class="timeline-prefecture-control">
          <strong id="timeline-prefecture" class="timeline-prefecture" aria-live="polite">全国</strong>
        </div>
        <output id="timeline-label" for="time-range"></output>
        <div class="timeline-dates">
          <label class="timeline-period-label"><span>期間</span>
            <select id="days">
              <option value="1">1日</option>
              <option value="2" selected>2日</option>
              <option value="7">1週間</option>
              <option value="14">2週間</option>
              <option value="30">1ヵ月</option>
              <option value="183">半年</option>
              <option value="365">1年</option>
            </select>
          </label>
          <label><span>開始</span><input id="date-from" type="date" required></label>
          <label><span>終了</span><input id="date-to" type="date" required></label>
        </div>
        <input id="time-range" type="range" aria-label="更新時刻">
        <div class="timeline-ends"><span id="time-start"></span><span id="time-end"></span></div>
        <div class="timeline-controls">

          <label class="timeline-step-label">間隔
            <select id="timeline-step" aria-label="タイムスケールの間隔">
              <option value="600000">10分</option>
              <option value="1800000">30分</option>
              <option value="3600000" selected>1時間</option>
              <option value="7200000">2時間</option>
              <option value="14400000">4時間</option>
              <option value="86400000">1日</option>
              <option value="604800000">1週間</option>
              <option value="1209600000">2週間</option>
            </select>
          </label>
          <button id="play-timeline" class="timeline-icon-button" type="button" aria-label="再生" title="再生"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7Z" fill="currentColor"/></svg></button>
          <button id="pause-timeline" class="timeline-icon-button" type="button" aria-label="停止" title="停止"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h4v12H7zm6 0h4v12h-4z" fill="currentColor"/></svg></button>
          <button id="download-data" class="timeline-icon-button timeline-download-button" type="button" disabled aria-label="表示中のデータをGeoJSONでダウンロード" title="表示中のデータをGeoJSONでダウンロード"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="share-view" class="timeline-share-button" type="button" aria-label="現在の表示URLをコピー" title="現在の表示URLをコピー">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 16.1c-.8 0-1.5.3-2 .8L8.9 12.8c.1-.3.1-.5.1-.8s0-.5-.1-.8L16 7.1c.5.5 1.2.8 2 .8a3 3 0 1 0-3-3c0 .3 0 .5.1.8L8 9.8a3 3 0 1 0 0 4.4l7.1 4.1c-.1.2-.1.5-.1.7a3 3 0 1 0 3-2.9Z" fill="currentColor"/></svg>
          </button>
          <span id="share-status" class="visually-hidden" aria-live="polite"></span>
        </div>
      </section>
    </div>
    <aside>
      <section class="prefecture-filter" aria-label="都道府県で絞り込み">
        <div id="prefecture-mini-map" aria-label="都道府県選択ミニマップ"></div>
        <button id="prefecture-filter-reset" type="button" hidden disabled aria-label="全国表示に戻す" title="全国表示に戻す"><svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14"><path d="M9 7 4 12l5 5v-3h5.5a4.5 4.5 0 0 1 4.2 2.9A7 7 0 0 0 12 8H9V7Z" fill="currentColor"/></svg><span>全国へ戻す</span></button>
      </section>
      <div class="poi-type-filter">
        <label for="poi-type"><span>種別</span><select id="poi-type" disabled><option value="">すべての種別</option></select></label>
      </div>
      <ol id="list"></ol>
    </aside>
  </main>
  <script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"></script>
  <script src="help.js"></script>
  <script src="app.js"></script>
</body>

</html>
